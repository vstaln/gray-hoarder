[package]
name = "gray-hoarder"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Archive session transcripts to a content-addressed local hoard on turn_end"

[[bin]]
name = "gray-hoarder"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
